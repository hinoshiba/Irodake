name: Irodake
options:
  bundleIdPrefix: com.hinoshiba
  developmentLanguage: ja
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "5"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "94HVVWXLK3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Irodake:
    type: application
    platform: macOS
    sources:
      - path: Sources/Irodake
      - path: Resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - path: TRADEMARKS.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.irodake
        PRODUCT_NAME: Irodake
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Irodake.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    scheme:
      testTargets:
        - IrodakeTests

  IrodakeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IrodakeTests
    dependencies:
      - target: Irodake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.irodake.tests
        GENERATE_INFOPLIST_FILE: YES
