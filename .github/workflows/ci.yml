name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip \
            --output "${RUNNER_TEMP}/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  ${RUNNER_TEMP}/xcodegen.zip" \
            | shasum -a 256 --check
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Validate scripts and manifests
        run: |
          zsh -n Scripts/*.sh
          sh -n ci_scripts/*.sh
          for script in ci_scripts/*.sh; do test -x "$script"; done
          plutil -lint Info.plist PrivacyInfo.xcprivacy Irodake.entitlements
          plutil -lint Resources/ja.lproj/InfoPlist.strings Resources/en.lproj/InfoPlist.strings
          ./Scripts/audit-source.sh
          ./Scripts/audit-brand.sh
          ./Scripts/audit-store-assets.sh

      - name: Verify committed Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          generated_state=$(git status --porcelain=v1 --untracked-files=all)
          if [ -n "${generated_state}" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Build and test Xcode scheme
        run: |
          xcodebuild \
            -project Irodake.xcodeproj \
            -scheme Irodake \
            -destination 'platform=macOS' \
            build test \
            CODE_SIGNING_ALLOWED=NO
